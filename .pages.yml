media:
  input: public/media
  output: /media
  categories: [image]
content:
  - name: "profile"
    label: "サイト基本情報"
    type: "file"
    path: "content/site.yml"
    format: "yaml"
    fields:
      - name: "name"
        label: "アーティスト名"
        type: "string"
        required: true
      - name: "tagline"
        label: "キャッチコピー"
        type: "string"
      - name: "bio"
        label: "プロフィール"
        type: "text"
      - name: "hero"
        label: "メインビジュアル"
        type: "image"
      - name: "heroAlt"
        label: "メインビジュアルの代替テキスト"
        type: "string"
      - name: "activities"
        label: "活動紹介"
        type: "string"
        list: true
      - name: "suno"
        label: "Suno URL"
        type: "string"
      - name: "youtube"
        label: "YouTube URL"
        type: "string"
      - name: "spotify"
        label: "Spotify URL"
        type: "string"
      - name: "other"
        label: "その他の配信URL"
        type: "string"
      - name: "x"
        label: "X URL"
        type: "string"
      - name: "contact"
        label: "問い合わせ先（メールアドレスまたはURL）"
        type: "string"
      - name: "contactNote"
        label: "お問い合わせ案内文"
        type: "text"
      - name: "sample"
        label: "サンプル表示"
        type: "boolean"
        default: false
  - name: "music"
    label: "楽曲"
    type: "collection"
    path: "content/music"
    format: "yaml-frontmatter"
    filename: "{fields.slug}.md"
    view: {"primary":"title","fields":["title","date","featured","order"]}
    fields:
      - name: "title"
        label: "曲名"
        type: "string"
        required: true
      - name: "slug"
        label: "スラッグ"
        type: "string"
        required: true
        pattern: {"regex":"^[a-z0-9]+(?:-[a-z0-9]+)*$","message":"半角英小文字と数字を使い、単語はハイフンで区切ってください。"}
        description: "URLに使う一意の値。公開後に変更するとURLが変わります。"
      - name: "date"
        label: "公開日"
        type: "date"
        required: true
        options: {"format":"yyyy-MM-dd"}
      - name: "cover"
        label: "ジャケット画像"
        type: "image"
      - name: "coverAlt"
        label: "画像の代替テキスト"
        type: "string"
      - name: "summary"
        label: "楽曲概要"
        type: "text"
      - name: "body"
        label: "詳細説明・制作背景"
        type: "rich-text"
      - name: "lyrics"
        label: "歌詞全文"
        type: "text"
      - name: "stylePrompt"
        label: "Styleプロンプト"
        type: "text"
      - name: "extraPrompt"
        label: "追加プロンプト"
        type: "text"
      - name: "showPrompts"
        label: "プロンプト表示設定（保存用）"
        type: "boolean"
        default: false
        description: "以前の設定を保持するための項目です。公開リポジトリに保存した値は閲覧可能です。"
      - name: "suno"
        label: "Suno URL"
        type: "string"
        description: "任意。Suno の楽曲URLを入力してください。"
      - name: "youtube"
        label: "YouTube URL"
        type: "string"
        description: "任意。動画の視聴URLまたは youtu.be の共有URLを入力してください。"
      - name: "spotify"
        label: "Spotify URL"
        type: "string"
        description: "任意。Spotify の楽曲URLを入力してください。"
      - name: "other"
        label: "その他の配信URL"
        type: "string"
      - name: "featured"
        label: "トップの代表作品に表示"
        type: "boolean"
        default: false
      - name: "order"
        label: "表示順（小さい順）"
        type: "number"
        default: 100
        options: {"step":1}
      - name: "sample"
        label: "サンプル表示"
        type: "boolean"
        default: false
  - name: "live"
    label: "ライブ"
    type: "collection"
    path: "content/live"
    format: "yaml-frontmatter"
    filename: {"template":"{fields.date}-{hour}{minute}{second}-{primary}.md","field":"create"}
    view: {"primary":"title","fields":["title","date","venue"]}
    fields:
      - name: "title"
        label: "イベント名"
        type: "string"
        required: true
      - name: "date"
        label: "開催日"
        type: "date"
        required: true
        options: {"format":"yyyy-MM-dd"}
      - name: "venue"
        label: "会場"
        type: "string"
        required: true
      - name: "image"
        label: "告知画像・写真"
        type: "image"
      - name: "imageAlt"
        label: "画像の代替テキスト"
        type: "string"
      - name: "body"
        label: "説明"
        type: "rich-text"
      - name: "url"
        label: "イベント詳細URL"
        type: "string"
      - name: "sample"
        label: "サンプル表示"
        type: "boolean"
        default: false
